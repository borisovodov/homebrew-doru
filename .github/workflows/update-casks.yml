name: Update casks

on:
  schedule:
    # Every four hours, like the bucket's excavator. A single unauthenticated
    # API call per run — far below the 60/hour rate limit.
    - cron: '47 */4 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Update cask if a new doru release exists
        run: |
          set -euo pipefail
          # One unauthenticated call: public repository data, asset digests
          # included. No secrets, no downloads.
          release=$(curl -fsSL https://api.github.com/repos/borisovodov/doru/releases/latest)
          version=$(printf '%s' "${release}" | jq -r '.tag_name' | sed 's/^v//')
          current=$(grep -m1 'version "' Casks/doru.rb | sed -E 's/.*version "([^"]+)".*/\1/')
          echo "latest release: ${version}, cask version: ${current}"
          if [ "${version}" = "${current}" ]; then
            echo "Cask is up to date; nothing to do."
            exit 0
          fi

          arm=$(printf '%s' "${release}" | jq -r '.assets[] | select(.name == "doru-mac-arm64.dmg") | .digest' | sed 's/^sha256://')
          arm64_linux=$(printf '%s' "${release}" | jq -r '.assets[] | select(.name == "doru-linux-arm64.AppImage") | .digest' | sed 's/^sha256://')
          x86_64_linux=$(printf '%s' "${release}" | jq -r '.assets[] | select(.name == "doru-linux-x86_64.AppImage") | .digest' | sed 's/^sha256://')
          for hash in "${arm}" "${arm64_linux}" "${x86_64_linux}"; do
            if [ -z "${hash}" ] || [ "${#hash}" -ne 64 ]; then
              echo "::error::missing or malformed sha256 digest in release v${version}"
              exit 1
            fi
          done

          python3 scripts/update-cask.py "${version}" "${arm}" "${arm64_linux}" "${x86_64_linux}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/doru.rb
          git commit -m "doru ${version}"
          git push
