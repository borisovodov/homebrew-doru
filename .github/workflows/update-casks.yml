name: Update casks

on:
  schedule:
    # Hourly. The check is a single feed request when nothing changed.
    - cron: '23 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Update cask if a new doru release exists
        run: |
          set -euo pipefail
          # The GitHub API is not reachable with the workflow token outside
          # this repository, so the latest version comes from the public
          # releases.atom feed (newest entry first, no rate limits).
          atom=$(curl -fsSL https://github.com/borisovodov/doru/releases.atom)
          tag=$(printf '%s' "${atom}" | grep -m1 -oE '/releases/tag/v[0-9]+(\.[0-9]+)*' | head -1 | grep -oE 'v[0-9]+(\.[0-9]+)*$')
          version="${tag#v}"
          current=$(grep -m1 'version "' Casks/doru.rb | sed -E 's/.*version "([^"]+)".*/\1/')
          echo "latest release: ${version}, cask version: ${current}"
          if [ "${version}" = "${current}" ]; then
            echo "Cask is up to date; nothing to do."
            exit 0
          fi

          # Download the three artifacts the cask pins and hash them.
          base="https://github.com/borisovodov/doru/releases/download/${tag}"
          tmp=$(mktemp -d)
          curl -fsSL -o "${tmp}/doru-mac-arm64.dmg" "${base}/doru-mac-arm64.dmg"
          curl -fsSL -o "${tmp}/doru-linux-arm64.AppImage" "${base}/doru-linux-arm64.AppImage"
          curl -fsSL -o "${tmp}/doru-linux-x86_64.AppImage" "${base}/doru-linux-x86_64.AppImage"
          arm=$(sha256sum "${tmp}/doru-mac-arm64.dmg" | cut -d' ' -f1)
          arm64_linux=$(sha256sum "${tmp}/doru-linux-arm64.AppImage" | cut -d' ' -f1)
          x86_64_linux=$(sha256sum "${tmp}/doru-linux-x86_64.AppImage" | cut -d' ' -f1)
          for hash in "${arm}" "${arm64_linux}" "${x86_64_linux}"; do
            if [ -z "${hash}" ] || [ "${#hash}" -ne 64 ]; then
              echo "::error::missing or malformed sha256 in release ${tag}"
              exit 1
            fi
          done

          python3 scripts/update-cask.py "${version}" "${arm}" "${arm64_linux}" "${x86_64_linux}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/doru.rb
          git commit -m "doru ${version}"
          git push
